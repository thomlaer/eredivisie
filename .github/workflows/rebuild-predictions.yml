name: Update Eredivisie predictions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/rebuild-predictions.yml"
  schedule:
    # Avoid the start of the hour: GitHub may delay or drop scheduled jobs then.
    - cron: "17 8 * * 3"
      timezone: "Europe/Amsterdam"
    # A second weekly run makes the refresh resilient if GitHub drops the first.
    - cron: "47 10 * * 3"
      timezone: "Europe/Amsterdam"

permissions:
  contents: write

concurrency:
  group: eredivisie-predictions-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Refresh sources and rebuild predictions
        run: python rebuild.py --force-live --simulations 10000

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add \
            dashboard/public/data/dashboard.json \
            data/raw/eredivisie_2026_fixtures.json \
            data/raw/source_update_report.json \
            data/raw/transfermarkt_eredivisie_current_performance.csv \
            data/raw/transfermarkt_eredivisie_current_squads.csv \
            data/raw/transfermarkt_eredivisie_injuries.csv \
            data/raw/transfermarkt_eredivisie_suspensions.csv \
            outputs/latest/champion_probabilities.csv \
            outputs/latest/current_table.csv \
            outputs/latest/model_metrics.json \
            outputs/latest/played_predictions.csv \
            outputs/latest/projected_table.csv \
            outputs/latest/upcoming_predictions.csv
          if git diff --cached --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git commit -m "Update Eredivisie predictions"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
            sleep 5
          done
          exit 1
